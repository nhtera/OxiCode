[package]
name = "oxicode-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
remote = ["oxicode-tasks/remote", "oxicode-tools/remote"]
dream = ["oxicode-tasks/dream", "oxicode-tools/dream"]
teammate = ["oxicode-tasks/teammate", "oxicode-tools/teammate"]
voice = ["dep:cpal"]
bridge = ["dep:tokio-tungstenite", "dep:jsonwebtoken"]
telemetry-otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "dep:tonic"]
enterprise = []
full = ["voice", "bridge", "telemetry-otlp"]
all = ["remote", "dream", "teammate", "voice", "bridge", "telemetry-otlp", "enterprise"]

[[bin]]
name = "oxicode"
path = "src/main.rs"

# Expose modules for integration tests (bridge_smoke, etc.).
[lib]
name = "oxicode_cli"
path = "src/lib.rs"

[dependencies]
oxicode-common = { workspace = true }
oxicode-config = { workspace = true }
oxicode-api = { workspace = true }
oxicode-core = { workspace = true }
oxicode-state = { workspace = true }
oxicode-session = { workspace = true }
oxicode-tui = { workspace = true }
oxicode-tools = { workspace = true }
oxicode-permissions = { workspace = true }
oxicode-hooks = { workspace = true }
oxicode-mcp = { workspace = true }
oxicode-agents = { workspace = true }
oxicode-skills = { workspace = true }
oxicode-tasks = { workspace = true }
oxicode-context = { workspace = true }
oxicode-plugins = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
git2 = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }

# Feature-gated dependencies (Phase 7)
cpal = { version = "0.15", optional = true }
tokio-tungstenite = { workspace = true, optional = true }
jsonwebtoken = { version = "9", optional = true }
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", optional = true, features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", optional = true, features = ["tonic", "trace"] }
tracing-opentelemetry = { version = "0.28", optional = true }
# tonic is pulled in transitively by opentelemetry-otlp; we pin the same version
# to access MetadataMap directly in telemetry_pipeline/otlp.rs.
tonic = { version = "0.12", optional = true, default-features = false }

[dev-dependencies]
criterion = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }
serde_json = { workspace = true }
oxicode-api = { workspace = true, features = ["test-support"] }
ratatui = { workspace = true }
# Used by bridge_smoke integration test to mint JWTs without unsafe env access.
jsonwebtoken = { version = "9" }
tokio-tungstenite = { workspace = true }

[[bench]]
name = "startup"
harness = false

[[bench]]
name = "token_counting"
harness = false
