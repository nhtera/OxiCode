[workspace]
members = [
    "crates/oxicode-common",
    "crates/oxicode-config",
    "crates/oxicode-api",
    "crates/oxicode-core",
    "crates/oxicode-state",
    "crates/oxicode-session",
    "crates/oxicode-tools",
    "crates/oxicode-permissions",
    "crates/oxicode-tui",
    "crates/oxicode-hooks",
    "crates/oxicode-mcp",
    "crates/oxicode-cli",
    "crates/oxicode-context",
    "crates/oxicode-agents",
    "crates/oxicode-skills",
    "crates/oxicode-tasks",
    "crates/oxicode-plugins",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/nicktien007/oxicode"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow common patterns
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
struct_field_names = "allow"
enum_variant_names = "allow"
unused_self = "allow"
unnecessary_literal_bound = "allow"
needless_pass_by_value = "allow"
cast_possible_truncation = "allow"
doc_markdown = "allow"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP + SSE
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "socks"], default-features = false }
reqwest-eventsource = "0.6"
url = "2"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Error handling
thiserror = "2"
anyhow = "1"

# Config
toml = "0.8"
dirs = "6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Git
git2 = "0.19"

# Markdown + syntax
pulldown-cmark = "0.12"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# Futures / streams
futures = "0.3"
tokio-stream = "0.1"

# Search / filesystem
glob = "0.3"
regex = "1"
walkdir = "2"
ignore = "0.4"

# Async trait
async-trait = "0.1"

# Crypto (for AWS SigV4 signing)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Internal crates
oxicode-common = { path = "crates/oxicode-common" }
oxicode-config = { path = "crates/oxicode-config" }
oxicode-api = { path = "crates/oxicode-api" }
oxicode-core = { path = "crates/oxicode-core" }
oxicode-state = { path = "crates/oxicode-state" }
oxicode-session = { path = "crates/oxicode-session" }
oxicode-tools = { path = "crates/oxicode-tools" }
oxicode-permissions = { path = "crates/oxicode-permissions" }
oxicode-tui = { path = "crates/oxicode-tui" }
oxicode-hooks = { path = "crates/oxicode-hooks" }
oxicode-mcp = { path = "crates/oxicode-mcp" }
oxicode-context = { path = "crates/oxicode-context" }
oxicode-agents = { path = "crates/oxicode-agents" }
oxicode-skills = { path = "crates/oxicode-skills" }
oxicode-tasks = { path = "crates/oxicode-tasks" }
oxicode-plugins = { path = "crates/oxicode-plugins" }

# --- Release Profiles ---

[profile.release]
lto = "thin"          # Link-Time Optimization (thin = faster builds, good size reduction)
strip = true          # Strip debug symbols from binary
codegen-units = 1     # Single codegen unit for maximum optimization
opt-level = 3         # Maximum speed optimization
panic = "abort"       # Smaller binary (no unwinding tables)

# Maximum size optimization profile
[profile.release-small]
inherits = "release"
opt-level = "z"       # Optimize for size over speed
lto = "fat"           # Full LTO for maximum size reduction

# Profiling profile — release speed with debug info
[profile.profiling]
inherits = "release"
strip = false
debug = true
