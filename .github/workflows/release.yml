name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: oxicode
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: oxicode
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: oxicode
          # macos-13 was retired in December 2025; macos-15-intel is the
          # remaining x86_64 image.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: oxicode
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: oxicode.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../oxicode-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}
          cd ../../..
          sha256sum oxicode-${{ github.ref_name }}-${{ matrix.target }}.tar.gz > oxicode-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.artifact }}" -DestinationPath "oxicode-${{ github.ref_name }}-${{ matrix.target }}.zip"
          (Get-FileHash "oxicode-${{ github.ref_name }}-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower() + "  oxicode-${{ github.ref_name }}-${{ matrix.target }}.zip" | Out-File -Encoding utf8 "oxicode-${{ github.ref_name }}-${{ matrix.target }}.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            oxicode-*.tar.gz
            oxicode-*.tar.gz.sha256
            oxicode-*.zip
            oxicode-*.zip.sha256

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
